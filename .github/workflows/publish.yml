# Publishes this n8n community node package to npm whenever the "version"
# field in package.json changes on the main branch.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# Publishing uses npm OIDC Trusted Publishing exclusively — no long-lived
# NPM_TOKEN secret is supported or read.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# 1. Log in to npmjs.com and open your package's settings.
# 2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
# 3. Select GitHub Actions and fill in:
#      Repository owner: <your-github-username-or-org>
#      Repository name:  <your-repo-name>
#      Workflow name:    publish.yml
#      Environment:      (leave blank unless you use GitHub Environments)
# 4. Do not create an NPM_TOKEN secret in this repository — GitHub's OIDC
#    token is used instead, so no secret ever touches your repo settings.
#
# Requires npm CLI >= 11.5.1 (bundled with Node 20.19+ / 22.16+), which knows
# how to exchange the GitHub OIDC token for a short-lived npm publish token.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# 1. Bump "version" in package.json (by hand, or with `npm version <bump>`)
#    and update CHANGELOG.md, then commit and push straight to main (or merge
#    a PR that does so).
# 2. This workflow runs on that push, notices the version field changed, and:
#      a. builds and tests the project
#      b. tags the commit "v<version>" and pushes the tag
#      c. creates a GitHub release, with notes taken from the matching
#         "## <version>" section of CHANGELOG.md
#      d. publishes the build to npm with provenance
# If package.json changes but the version field doesn't, the workflow exits
# early without tagging or publishing anything.

name: Publish

on:
  push:
    branches:
      - main
    # Only even consider running when package.json changed — cheap early
    # filter. The version-diff check below still guards against unrelated
    # package.json edits (e.g. a script or dependency change).
    paths:
      - package.json

jobs:
  version-check:
    name: Check whether the version changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version-check.outputs.changed }}
      version: ${{ steps.version-check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so we can read package.json as it was *before* this
          # push (github.event.before) and diff its version against HEAD.
          fetch-depth: 0

      - name: Check whether the version changed
        id: version-check
        run: |
          # github.event.before is the commit SHA the branch pointed to
          # before this push — the correct "previous state" even if the push
          # contained multiple commits. On the very first push to a new
          # branch it's all zeros, in which case there's nothing to diff
          # against and we treat this as a version change (first release).
          before='${{ github.event.before }}'
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            previous=""
          else
            previous=$(git show "$before:package.json" 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' 2>/dev/null || echo "")
          fi

          current=$(node -p "require('./package.json').version")
          echo "Previous version: ${previous:-<none>}"
          echo "Current version:  $current"

          if [ "$previous" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      # Lets GitHub show a "View deployment" link (Environments tab, commit
      # status, deployments list) that points straight at the published
      # version on npmjs.com. Update the package name here if it ever changes.
      url: https://www.npmjs.com/package/n8n-nodes-bluesky-full/v/${{ needs.version-check.outputs.version }}

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # create tags + GitHub releases
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false  # never use caching in release builds

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Nothing is published if this fails: the job stops at the first failing
      # step, and the tag pushed above is the only thing already done.
      - name: Test
        run: npm test

      - name: Publish to npm
        # Requires id-token: write above and a Trusted Publisher configured
        # on npmjs.com (see "ONE-TIME SETUP" at the top of this file). No
        # NPM_TOKEN is read — OIDC is the only supported auth path.
        run: npm run release

      - name: Create and push tag
        run: |
          tag="v${{ needs.version-check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - name: Build release notes
        id: notes
        run: |
          # Pull the "## <version>" section out of CHANGELOG.md, stopping at
          # the next "## " heading. Empty output means no matching section —
          # the release step then falls back to auto-generated notes.
          version='${{ needs.version-check.outputs.version }}'
          notes=$(awk -v v="## $version" '$0 == v {found=1; next} found && /^## / {exit} found' CHANGELOG.md)
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          tag="v${{ needs.version-check.outputs.version }}"
          pkg_name=$(node -p "require('./package.json').name")
          npm_line="npm package: https://www.npmjs.com/package/$pkg_name/v/${{ needs.version-check.outputs.version }}"

          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            { printf '%s\n\n' "$npm_line"; printf '%s\n' "$NOTES"; } > release-notes.md
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          else
            # --generate-notes builds its notes server-side, so there's nothing
            # to prepend to yet — create the release first, then edit it in to
            # the auto-generated body.
            gh release create "$tag" --title "$tag" --generate-notes
            { printf '%s\n\n' "$npm_line"; gh release view "$tag" --json body -q .body; } > release-notes.md
            gh release edit "$tag" --notes-file release-notes.md
          fi
