# Publishes this n8n community node package to npm whenever the "version"
# field in package.json changes on the main branch.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: <your-github-username-or-org>
#        Repository name:  <your-repo-name>
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Leave the NPM_TOKEN secret unset in this repository. GitHub's OIDC
#      token is used instead — no secret ever touches your repo settings.
#
# Option B — npm Automation Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token.
#      Scope it to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret.
#      Name it NPM_TOKEN and paste the token value.
#
# Both options work with --provenance. Provenance is signed by GitHub's OIDC
# infrastructure regardless of how npm authentication is handled.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# 1. Bump "version" in package.json (by hand, or with `npm version <bump>`)
#    and update CHANGELOG.md, then commit and push straight to main (or merge
#    a PR that does so).
# 2. This workflow runs on that push, notices the version field changed, and:
#      a. tags the commit "v<version>" and pushes the tag
#      b. builds the project
#      c. publishes the build to npm with provenance
# If package.json changes but the version field doesn't, the workflow exits
# early without tagging or publishing anything.

name: Publish

on:
  push:
    branches:
      - main
    # Only even consider running when package.json changed — cheap early
    # filter. The version-diff check below still guards against unrelated
    # package.json edits (e.g. a script or dependency change).
    paths:
      - package.json

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Needed to push the new "v<version>" tag created below.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can read package.json as it was *before* this
          # push (github.event.before) and diff its version against HEAD.
          fetch-depth: 0

      - name: Check whether the version changed
        id: version-check
        run: |
          # github.event.before is the commit SHA the branch pointed to
          # before this push — the correct "previous state" even if the push
          # contained multiple commits. On the very first push to a new
          # branch it's all zeros, in which case there's nothing to diff
          # against and we treat this as a version change (first release).
          before='${{ github.event.before }}'
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            previous=""
          else
            previous=$(git show "$before:package.json" 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' 2>/dev/null || echo "")
          fi

          current=$(node -p "require('./package.json').version")
          echo "Previous version: ${previous:-<none>}"
          echo "Current version:  $current"

          if [ "$previous" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          fi

      # Everything below only runs when the version actually changed.

      - name: Create and push tag
        if: steps.version-check.outputs.changed == 'true'
        run: |
          tag="v${{ steps.version-check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - name: Set up Node.js
        if: steps.version-check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        if: steps.version-check.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.version-check.outputs.changed == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.version-check.outputs.changed == 'true'
        # Requires id-token: write above. NPM_TOKEN unset → OIDC is used
        # instead (see "ONE-TIME SETUP" at the top of this file).
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
